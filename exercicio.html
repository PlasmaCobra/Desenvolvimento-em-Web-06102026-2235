<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de média</title>
</head>
<body>
    <main>
        <h1>Calculadora de média</h1>
        <p>Digite as três notas do aluno (de 0 a 10):</p>

        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" min="0" max="10" step="any">

        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" min="0" max="10" step="any">

        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" min="0" max="10" step="any">

        <button type="button" id="calcular">Calcular média</button>
        <p id="resultado" aria-live="polite">O resultado será exibido aqui.</p>
    </main>
    <script src="exercicio.js"></script>
</body>
</html>
